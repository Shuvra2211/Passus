<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <meta content="#fbf8f3" name="theme-color" />
  <meta content="PASSUS premium footwear store — standalone interactive demo. Men and women crocs, slippers, sneakers."
    name="description" />
  <title>PASSUS</title>
  <style>
    :root {
      --ink: #18233d;
      --text: #4a5060;
      --muted: #7e8491;
      --coral: #f16e54;
      --coral-dark: #de5239;
      --cream: #fcf9f5;
      --sand: #f6f1ea;
      --line: #e9e7e5;
      --paper: #fff;
      --navy: #233457;
      --shadow: 0 24px 70px rgba(23, 35, 61, .09);
      --radius: 22px;
      --max: 1250px
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    textarea,
    select {
      font: inherit
    }

    button {
      cursor: pointer
    }

    a {
      text-decoration: none;
      color: inherit
    }

    img {
      max-width: 100%;
      display: block
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #f5a68b;
      outline-offset: 3px
    }

    ::selection {
      background: #ffd2c4;
      color: #19243f
    }

    .wrap {
      width: min(var(--max), calc(100% - 90px));
      margin-inline: auto
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .19em;
      font-weight: 800;
      font-size: 11px;
      color: var(--coral)
    }

    .tiny-dot {
      width: 7px;
      height: 7px;
      background: var(--coral);
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px
    }

    .promo-strip {
      height: 32px;
      background: #233457;
      color: #fdf9f4;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: .13em;
      text-align: center;
      padding: 0 16px
    }

    .site-header {
      background: rgba(252, 249, 245, .95);
      border-bottom: 1px solid #ebe8e3;
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(12px)
    }

    .header-inner {
      height: 80px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px
    }

    .logo {
      font-size: 31px;
      line-height: 1;
      letter-spacing: -.09em;
      font-weight: 800;
      color: #223456;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      width: max-content
    }

    .logo i {
      display: inline-block;
      width: 13px;
      height: 13px;
      background: var(--coral);
      border-radius: 3px 10px 3px 10px;
      transform: rotate(-25deg) translateY(-8px)
    }

    .logo small {
      font-size: 9px;
      letter-spacing: .18em;
      font-weight: 800;
      color: var(--coral);
      margin-left: 5px;
      align-self: flex-end;
      margin-bottom: 2px
    }

    .desktop-nav {
      display: flex;
      gap: 40px;
      align-items: center
    }

    .desktop-nav a {
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .09em;
      position: relative;
      text-transform: uppercase;
      color: #46516a
    }

    .desktop-nav a:hover,
    .desktop-nav a.active {
      color: var(--coral-dark)
    }

    .desktop-nav a.active:after {
      content: '';
      position: absolute;
      bottom: -28px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--coral)
    }

    .nav-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 11px
    }

    .icon-button {
      border: 1px solid #ebe6e0;
      border-radius: 50%;
      height: 40px;
      width: 40px;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      position: relative;
      transition: .25s
    }

    .icon-button:hover {
      border-color: var(--coral);
      transform: translateY(-2px)
    }

    .icon-button svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .cart-count {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--coral);
      color: #fff;
      font-size: 10px;
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-weight: 800
    }

    .mobile-menu-btn {
      display: none
    }

    .mobile-nav {
      display: none
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 51px;
      padding: 0 24px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .055em;
      text-transform: uppercase;
      transition: transform .25s, box-shadow .25s, background .25s;
      white-space: nowrap
    }

    .btn:hover {
      transform: translateY(-3px)
    }

    .btn-primary {
      background: linear-gradient(125deg, #fa9073, var(--coral-dark));
      color: #fff;
      box-shadow: 0 12px 25px #ef785944
    }

    .btn-primary:hover {
      box-shadow: 0 15px 33px #ef78595c
    }

    .btn-dark {
      background: #223456;
      color: #fff
    }

    .btn-outline {
      border-color: #d6d8db;
      background: transparent;
      color: var(--ink)
    }

    .btn-outline:hover {
      border-color: var(--ink);
      background: #fff
    }

    .btn-light {
      background: #fff;
      color: var(--ink)
    }

    .btn-small {
      min-height: 40px;
      padding: 0 15px;
      font-size: 10px;
      border-radius: 10px
    }

    .btn-block {
      width: 100%
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(105deg, #fcf9f5 50%, #ffede2 100%);
      min-height: 602px
    }

    .hero-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 42% 58%;
      align-items: center;
      min-height: 602px
    }

    .hero-copy {
      position: relative;
      z-index: 3;
      padding: 42px 0 75px
    }

    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      color: #65708a;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: .19em
    }

    .hero-kicker:before {
      content: '';
      width: 24px;
      height: 2px;
      background: var(--coral)
    }

    .hero h1,
    .shop-hero h1 {
      font-family: Manrope, Arial, sans-serif;
      font-weight: 800;
      font-size: clamp(55px, 6.4vw, 94px);
      letter-spacing: -.09em;
      line-height: 1.05;
      margin: 0;
      color: var(--navy)
    }

    .hero h1>span {
      display: block
    }

    .hero h1 .accent {
      color: var(--coral);
      font-style: italic;
      display: inline
    }

    .hero-copy p {
      max-width: 410px;
      font-size: 15px;
      color: #6c7280;
      line-height: 1.95;
      margin: 24px 0 30px
    }

    .hero-cta {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap
    }

    .hero-meta {
      display: flex;
      gap: 27px;
      align-items: center;
      margin-top: 49px;
      color: #777f8f;
      font-size: 12px;
      font-weight: 600
    }

    .hero-meta b {
      color: var(--navy);
      font-weight: 800
    }

    .hero-meta .line {
      width: 1px;
      height: 25px;
      background: #d9d4cf
    }

    .hero-art {
      position: relative;
      height: 590px;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate
    }

    .hero-blob {
      position: absolute;
      width: 700px;
      height: 640px;
      border-radius: 50%;
      left: 5%;
      top: -80px;
      background: radial-gradient(circle at 31% 38%, #ffe0c4 0%, #ffc18f 37%, #f6876e 68%, #e86058 100%);
      filter: saturate(1.09);
      z-index: -2
    }

    .hero-ring {
      position: absolute;
      width: 560px;
      height: 560px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
      left: 20%;
      top: 2%;
      z-index: -1
    }

    .hero-art .main-shoe {
      width: 126%;
      max-width: none;
      filter: drop-shadow(0 30px 26px rgba(66, 57, 68, .15));
      transform: translate(-10px, -3px) rotate(-2deg);
      animation: float 6s ease-in-out infinite
    }

    .hero-circle-text {
      position: absolute;
      right: 0;
      top: 80px;
      border: 1px solid #ffffff94;
      color: #fff;
      padding: 14px 19px;
      border-radius: 35px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      backdrop-filter: blur(4px)
    }

    .hero-sticker {
      position: absolute;
      bottom: 110px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      color: var(--navy);
      width: 110px;
      height: 110px;
      box-shadow: 0 13px 40px #754d4833;
      transform: rotate(12deg)
    }

    .hero-sticker span {
      font-size: 25px
    }

    .hero-sticker b {
      font-size: 12px;
      text-align: center;
      line-height: 1.2
    }

    .hero-vertical {
      position: absolute;
      right: -7px;
      bottom: 44px;
      writing-mode: vertical-rl;
      letter-spacing: .35em;
      font-weight: 800;
      font-size: 11px;
      color: #ffffffad
    }

    .hero-index {
      position: absolute;
      bottom: 34px;
      right: 70px;
      color: #fff;
      font-size: 11px;
      letter-spacing: .18em;
      font-weight: 700
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(-10px, -3px) rotate(-2deg)
      }

      50% {
        transform: translate(-10px, -21px) rotate(-1deg)
      }
    }

    .value-bar {
      position: relative;
      z-index: 2;
      background: #fff;
      border-bottom: 1px solid var(--line)
    }

    .value-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr)
    }

    .value-item {
      padding: 27px 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-right: 1px solid #f0edeb
    }

    .value-item:first-child {
      padding-left: 0
    }

    .value-item:last-child {
      border: 0
    }

    .value-symbol {
      flex: 0 0 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff0e8;
      color: var(--coral);
      display: grid;
      place-items: center;
      font-size: 21px
    }

    .value-item:nth-child(2) .value-symbol {
      background: #e7f4fb;
      color: #399cbc
    }

    .value-item:nth-child(3) .value-symbol {
      background: #f4edff;
      color: #8067b3
    }

    .value-item:nth-child(4) .value-symbol {
      background: #e7f5ee;
      color: #429674
    }

    .value-item b {
      font-size: 12px;
      display: block;
      margin-bottom: 3px
    }

    .value-item small {
      font-size: 10px;
      color: #9297a1;
      line-height: 1.4
    }

    .section {
      padding: 100px 0
    }

    .section-small {
      padding: 67px 0
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 31px
    }

    .section-heading h2,
    .collection-head h2 {
      font-family: Manrope, Arial, sans-serif;
      font-size: clamp(30px, 3.7vw, 44px);
      letter-spacing: -.065em;
      line-height: 1.18;
      margin: 9px 0 0
    }

    .section-desc {
      color: #81858e;
      font-size: 13px;
      max-width: 280px;
      line-height: 1.75
    }

    .text-link {
      font-weight: 800;
      font-size: 12px;
      border-bottom: 1px solid var(--coral);
      padding-bottom: 5px;
      white-space: nowrap
    }

    .offers-grid {
      display: grid;
      grid-template-columns: 1.24fr 1fr;
      gap: 23px
    }

    .offer-card {
      min-height: 330px;
      border-radius: 25px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      padding: 39px;
      display: flex;
      align-items: center
    }

    .offer-card.coral {
      background: linear-gradient(135deg, #ffcda7, #f38a76)
    }

    .offer-card.navy {
      background: linear-gradient(120deg, #253b65, #162642);
      color: #fff
    }

    .offer-copy {
      z-index: 2;
      position: relative;
      max-width: 54%
    }

    .offer-copy .eyebrow {
      color: inherit;
      opacity: .78
    }

    .offer-copy h3 {
      font-family: Manrope, Arial, sans-serif;
      font-size: clamp(30px, 3.5vw, 49px);
      letter-spacing: -.07em;
      line-height: 1.15;
      margin: 17px 0
    }

    .offer-copy p {
      font-size: 12px;
      line-height: 1.8;
      margin: 0 0 23px;
      opacity: .78
    }

    .offer-photo {
      position: absolute;
      right: -15%;
      bottom: -28px;
      width: 72%;
      transform: rotate(-11deg);
      filter: drop-shadow(0 25px 20px #6a375c36);
      transition: .5s
    }

    .offer-card:hover .offer-photo {
      transform: rotate(-6deg) translateY(-13px)
    }

    .offer-card.navy .offer-photo {
      width: 77%;
      right: -15%;
      bottom: 4px
    }

    .offer-bubble {
      position: absolute;
      right: 35px;
      top: 27px;
      width: 63px;
      height: 63px;
      border: 1px solid #fff6;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em
    }

    .collection-head {
      text-align: center;
      margin-bottom: 35px
    }

    .collection-head p {
      color: #888d98;
      line-height: 1.8;
      font-size: 13px;
      max-width: 450px;
      margin: 13px auto 0
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px
    }

    .category-card {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: #f4ece4;
      min-height: 380px;
      padding: 30px;
      display: flex;
      align-items: end;
      transition: .3s
    }

    .category-card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow)
    }

    .category-card.cat-crocs {
      background: #dff0e8
    }

    .category-card.cat-slippers {
      background: #e7e8f4
    }

    .category-card.cat-sneakers {
      background: #fce1d2
    }

    .category-card:before {
      content: '';
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: #ffffff77;
      top: -85px;
      right: -75px
    }

    .category-card img {
      width: 130%;
      max-width: none;
      position: absolute;
      top: 31px;
      left: -14%;
      height: 270px;
      object-fit: contain;
      transition: .4s;
      filter: drop-shadow(0 20px 15px #2e31402a)
    }

    .category-card:hover img {
      transform: scale(1.06) rotate(-3deg)
    }

    .category-card .cat-text {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: end
    }

    .category-card small {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .17em;
      color: #73808b;
      font-weight: 800
    }

    .category-card h3 {
      font-size: 29px;
      letter-spacing: -.07em;
      margin: 8px 0 0
    }

    .circle-arrow {
      width: 43px;
      height: 43px;
      background: #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 14px #25365b11;
      font-size: 20px
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 23px
    }

    .product-card {
      min-width: 0
    }

    .product-media {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      height: 258px;
      display: grid;
      place-items: center;
      cursor: pointer
    }

    .bg-peach {
      background: #f9e9e1
    }

    .bg-pink {
      background: #f6e5e7
    }

    .bg-butter {
      background: #f8efd8
    }

    .bg-ice {
      background: #e7f1f4
    }

    .bg-mint {
      background: #e3f0e8
    }

    .bg-lavender {
      background: #ede9f4
    }

    .product-media img {
      width: 118%;
      max-width: none;
      height: 100%;
      object-fit: contain;
      transition: .45s;
      filter: drop-shadow(0 10px 7px #343c5030)
    }

    .product-card:hover .product-media img {
      transform: scale(1.095) rotate(-4deg)
    }

    .product-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #fff;
      color: #293851;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .07em;
      padding: 9px 11px;
      border-radius: 30px;
      z-index: 2
    }

    .product-badge.sale {
      background: #f36f57;
      color: #fff
    }

    .media-add {
      position: absolute;
      bottom: 15px;
      right: 15px;
      border: 0;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      background: #fff;
      color: var(--navy);
      font-size: 24px;
      box-shadow: 0 5px 12px #0001;
      transition: .25s;
      z-index: 3
    }

    .media-add:hover {
      background: var(--navy);
      color: #fff;
      transform: rotate(90deg)
    }

    .product-info {
      padding: 17px 4px 0
    }

    .product-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      font-size: 10px;
      font-weight: 700;
      color: #93949a;
      text-transform: uppercase;
      letter-spacing: .1em
    }

    .product-info h3 {
      font-size: 16px;
      letter-spacing: -.04em;
      margin: 9px 0 6px
    }

    .price {
      display: flex;
      gap: 9px;
      align-items: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--navy)
    }

    .price s {
      color: #a7a8af;
      font-size: 12px;
      font-weight: 500
    }

    .preorder-note {
      font-size: 10px;
      background: #fff1dd;
      color: #996024;
      border-radius: 30px;
      padding: 5px 7px;
      font-weight: 800
    }

    .wide-banner {
      background: #23365e;
      color: white;
      border-radius: 28px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      min-height: 324px;
      position: relative;
      overflow: hidden
    }

    .wide-banner:before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border: 1px solid #ffffff29;
      border-radius: 50%;
      top: -200px;
      right: -90px
    }

    .wide-banner-text {
      padding: 55px 65px;
      position: relative;
      z-index: 2
    }

    .wide-banner h2 {
      font-size: clamp(32px, 4vw, 55px);
      letter-spacing: -.07em;
      line-height: 1.15;
      margin: 14px 0
    }

    .wide-banner p {
      font-size: 13px;
      color: #c0cbe0;
      max-width: 360px;
      line-height: 1.8
    }

    .wide-banner img {
      width: 120%;
      max-width: none;
      margin-left: -7%;
      transform: rotate(-5deg);
      filter: drop-shadow(0 22px 25px #0004)
    }

    .site-footer {
      margin-top: 80px;
      background: #192840;
      color: #fff;
      padding: 65px 0 22px
    }

    .footer-main {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.35fr;
      gap: 40px
    }

    .site-footer .logo {
      color: #fff
    }

    .footer-brand p {
      color: #a8b2c1;
      line-height: 1.9;
      font-size: 13px;
      max-width: 300px
    }

    .footer-col h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .13em;
      margin: 6px 0 23px
    }

    .footer-col a,
    .footer-col p {
      display: block;
      color: #a7b2c1;
      font-size: 12px;
      line-height: 2.3;
      margin: 0
    }

    .footer-col a:hover {
      color: #fff
    }

    .footer-bottom {
      border-top: 1px solid #384458;
      margin-top: 50px;
      padding-top: 20px;
      display: flex;

    /* ================= PASSUS / SIGNATURE PREMIUM EDITION ================= */
    :root {
      --ink: #18243d;
      --navy: #1c2d4c;
      --coral: #ee765b;
      --coral-dark: #d95b44;
      --cream: #fbf8f3;
      --sand: #f6f0e8;
      --shadow: 0 28px 80px rgba(33, 34, 48, .085)
    }

    body {
      background: var(--cream)
    }

    .site-header {
      background: rgba(251, 248, 243, .88);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border-bottom: 1px solid rgba(41, 45, 61, .08);
      box-shadow: 0 8px 34px rgba(13, 25, 45, .035)
    }

    .site-header::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #f5b8aa 50%, transparent);
      opacity: .45;
      pointer-events: none
    }

    .header-inner {
      height: 82px
    }

    .logo {
      font-weight: 900;
      letter-spacing: -.10em;
      transition: transform .3s, color .3s
    }

    .logo:hover {
      transform: translateY(-2px)
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(27, 42, 71, .065);
      padding: 6px;
      border-radius: 40px;
      background: #edeae6a6;
      box-shadow: inset 0 1px 2px #00000006
    }

    .desktop-nav a {
      font-size: 11px;
      letter-spacing: .065em;
      padding: 13px 18px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #667087;
      transition: color .22s, background .22s, box-shadow .22s, transform .22s
    }

    .desktop-nav a svg {
      opacity: .85;
      transition: transform .25s
    }

    .desktop-nav a:hover svg {
      transform: translateY(-1px)
    }

    .desktop-nav a:hover {
      background: #ffffffb0;
      color: var(--ink)
    }

    .desktop-nav a.active {
      background: #203351;
      color: #fff;
      box-shadow: 0 6px 18px #12243c2e;
      color: #fff
    }

    .desktop-nav a.active:after {
      display: none
    }

    .nav-actions {
      gap: 10px
    }

    .icon-button {
      height: 43px;
      width: 43px;
      box-shadow: 0 4px 15px rgba(20, 40, 55, .035)
    }

    .icon-button:hover {

      box-shadow: 0 6px 19px rgba(218, 93, 65, .13)
    }

    .mobile-bottom-nav {
      display: none
    }

    .promo-strip {
      height: 29px;
      background: linear-gradient(100deg, #1a2945, #314569, #1a2945);
      font-size: 10px;
      letter-spacing: .15em
    }

    .hero {
      background: radial-gradient(ellipse at 4% 52%, #fff 0%, transparent 48%), linear-gradient(105deg, #fbf8f3 49%, #fff0e8 100%)
    }

    .hero::after {
      content: "";
      width: 300px;
      height: 300px;
      border: 1px solid rgba(236, 163, 124, .12);
      position: absolute;
      left: -170px;
      top: 8%;
      border-radius: 50%;
      pointer-events: none
    }

    .hero .hero-copy>* {
      animation: passus-rise .8s ease-out both
    }

    .hero .hero-copy>*:nth-child(2) {
      animation-delay: .12s
    }

    .hero .hero-copy>*:nth-child(3) {
      animation-delay: .21s
    }

    .hero .hero-copy>*:nth-child(4) {
      animation-delay: .28s
    }

    .hero .hero-copy>*:nth-child(5) {
      animation-delay: .35s
    }

    .hero h1 {
      letter-spacing: -.085em
    }

    .hero .accent {
      background: linear-gradient(125deg, #f38a68, #d6544a);
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text
    }

    .hero-blob {
      animation: passus-blob 12s ease-in-out infinite alternate
    }

    .hero-ring {
      animation: passus-spin 45s linear infinite;
      border-style: dashed;
      border-color: #ffffffa0
    }

    .hero-sticker {
      animation: passus-sticker 5s ease-in-out infinite
    }

    .hero-art .main-shoe {
      animation: passus-float 6s ease-in-out infinite;
      transition: filter .3s
    }

    .hero-art:hover .main-shoe {
      filter: drop-shadow(0 37px 28px rgba(66, 57, 68, .2))
    }

    .hero-kicker,
    .eyebrow {
      letter-spacing: .18em
    }

    .hero-meta {
      letter-spacing: .01em
    }

    .btn {
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
      transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s, background .3s, border-color .3s
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, .36) 45%, transparent 65%);
      transform: translateX(-160%);
      transition: transform .7s ease;
      pointer-events: none
    }

    .btn:hover::before {
      transform: translateX(165%)
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.012)
    }

    .btn:active {
      transform: translateY(0) scale(.975)
    }

    .btn-primary {
      background: linear-gradient(115deg, #f18b70, #d95a47);
      box-shadow: 0 13px 28px #ec755346
    }

    .btn-dark {
      background: linear-gradient(125deg, #223859, #182943)
    }

    .product-card {
      transition: transform .4s ease, filter .4s ease
    }

    .product-card:hover {
      transform: translateY(-7px);
      filter: drop-shadow(0 15px 16px rgba(36, 49, 65, .045))
    }

    .product-media {
      position: relative;
      overflow: hidden;
      transition: box-shadow .3s ease, border-radius .3s ease
    }

    .product-card:hover .product-media {
      box-shadow: 0 16px 32px rgba(30, 39, 60, .1)
    }

    .product-media img {
      transition: transform .65s cubic-bezier(.2, .8, .2, 1), filter .5s ease
    }

    .product-card:hover .product-media img {
      transform: scale(1.09) rotate(-2deg);
      filter: drop-shadow(0 10px 13px #141e3020)
    }

    .media-add {

    .media-add:hover {
      transform: rotate(90deg) scale(1.13);
      background: var(--navy);
      color: #fff
    }

    .offer-card,
    .category-card,
    .wide-banner {
      transition: transform .42s cubic-bezier(.2, .7, .2, 1), box-shadow .42s
    }

    .category-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 24px 42px rgba(22, 37, 61, .1)
    }

    .offer-card img,
    .category-card img {

    .offer-card:hover img {

    .value-item {

    .value-item:hover {

    .order-tabs {

      background: #f1ede8;
      box-shadow: 0 3px 18px #26314d09

    }

    .order-tab:hover {

    .white-panel {

    .search-input {

    /* Layer for global search. Search icon always opens this dialog. */
    .global-search-layer {

      background: #f8f4ef;
      border: 1px solid #f1e7db;

    }

    .global-search-quick a:hover {
      background: #fde9e0;
      transform: translateY(-2px)
    }

    .global-search-result-heading {
      padding: 20px 35px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px
    }

    }

    }

    .global-search-results {

    .global-search-item {

      display: flex;

      align-items: center;
      padding: 9px;

      color: var(--ink);

    }

    }

      place-items: center;
      overflow: hidden
    }

      width: 100%;

    }

    .global-search-item:hover img {

    }

    .global-search-item-copy {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      min-width: 0
    }

    .global-search-item-copy b {

    }

    .global-search-item-copy small {
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #9197a2
    }

    .global-search-item strong {
      font-size: 12px;
      white-space: nowrap
    }

    .global-search-item>svg {
      color: var(--coral);
      flex: 0 0 16px
    }

    .global-search-empty {
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #b7abb0;
      text-align: center
    }

    .global-search-empty b {
      color: var(--ink);
      font-size: 13px
    }

    .global-search-empty span {
      font-size: 12px
    }

    .global-search-bottom {
      text-align: center;
      border-top: 1px solid #f1ece5;
      padding: 14px 20px 17px;
      font-size: 10px;
      color: #9c9e9f;
      letter-spacing: .08em
    }

    .reveal-ready {
      opacity: 1;
      transform: none
    }

    .reveal-ready.reveal-visible {
      animation: passus-soft-reveal .72s ease var(--reveal-delay, 0ms) both
    }

    @keyframes passus-soft-reveal {
      from {
        opacity: .75;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes passus-rise {
      from {
        opacity: 0;
        transform: translateY(19px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes passus-float {

      0%,
      100% {
        transform: translate(-10px, -3px) rotate(-2deg)
      }

      50% {
        transform: translate(-4px, -17px) rotate(-.6deg)
      }
    }

    @keyframes passus-blob {
      from {
        transform: scale(1) translateY(0)
      }

      to {
        transform: scale(1.045) translateY(7px)
      }
    }

    @keyframes passus-spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes passus-sticker {

      0%,
      100% {
        transform: translateY(0) rotate(12deg)
      }

      50% {
        transform: translateY(-6px) rotate(9deg)
      }
    }

    @keyframes passus-overlay {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes passus-search-enter {
      from {
        opacity: .7;
        transform: translateY(-17px) scale(.97)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    /* PASSUS Bangladesh-wide checkout — cascading locations, discreet premium details */
    #upazila-custom-field[hidden],
    #union-custom-field[hidden] {

    }

    .location-heading {
      display: flex;
      gap: 9px;

          if (!response.ok) throw Error('Location data unavailable');
          const full = await response.json();
          if (!Array.isArray(full) || full.length !== 8 || full.reduce((n, d) => n + (d.districts?.length || 0), 0) !== 64) throw Error('Location data mismatch');
          bdFull = full;
          // Cache a slim version: no coordinates / metadata to keep localStorage lean.
          try {localStorage.setItem('passus_bd_geo_v2', JSON.stringify(full.map(d => ({name: d.name, bn_name: d.bn_name, districts: d.districts.map(z => ({name: z.name, bn_name: z.bn_name, upazilas: z.upazilas.map(u => ({name: u.name, bn_name: u.bn_name, unions: u.unions || [], pourashavas: (u.pourashavas || []).map(p => ({name: p.name, bn_name: p.bn_name}))}))}))}))));} catch { }
          bdRefreshGeoControls();
        } catch {
          const hint = document.querySelector('#bd-geo-status'); if (hint) hint.textContent = 'উপজেলার তালিকা লোড হয়নি। নিজের হাতে উপজেলা/থানা লিখে অর্ডার করতে পারবেন।';
        } finally {bdGeoLoading = false}
      }
      function bdOptions(items, first) {return '<option value="">' + e(first) + '</option>' + items.map(x => `<option value="${e(x.en || x.name)}">${bdLabel(x)}</option>`).join('')}
      function bdRefreshGeoControls() {
        const district = document.querySelector('#checkout-district');
        if (!district || !district.value) return;
        const up = document.querySelector('#checkout-upazila');
        if (!up || up.value && up.value !== '__manual__') return;
        bdDistrictChanged(true);
      }
      function bdDivisionChanged() {
        const divName = document.querySelector('#checkout-division')?.value || '';
        const district = document.querySelector('#checkout-district'); if (!district) return;
        const d = bdBase.find(x => x.en === divName);
        district.innerHTML = bdOptions(d?.districts || [], 'জেলা নির্বাচন করুন'); district.disabled = !d;
        bdResetUpazila();
      }
      function bdResetUpazila() {
        const up = document.querySelector('#checkout-upazila'); const union = document.querySelector('#checkout-union');
        if (up) {up.innerHTML = '<option value="">আগে জেলা নির্বাচন করুন</option>'; up.disabled = true;}
        if (union) {union.innerHTML = '<option value="">আগে উপজেলা/থানা নির্বাচন করুন</option>'; union.disabled = true;}
        const fallback = document.querySelector('#upazila-custom-field'); if (fallback) fallback.hidden = true; const input = document.querySelector('#checkout-upazila-custom'); if (input) input.required = false;
        const uFallback = document.querySelector('#union-custom-field'); if (uFallback) uFallback.hidden = true;
      }
      function bdDistrictChanged(preserveManual = false) {
        const up = document.querySelector('#checkout-upazila'); if (!up) return;
        const d = document.querySelector('#checkout-division')?.value || '';
        const dist = document.querySelector('#checkout-district')?.value || '';
        const options = bdGetUpazilas(d, dist);
        up.disabled = !dist;
        const old = up.value;
        up.innerHTML = '<option value="">' + (options.length ? 'উপজেলা / থানা নির্বাচন করুন' : 'উপজেলা / থানা লিখুন') + '</option>' +
          options.map(x => `<option value="${e(x.name)}">${bdLabel(x)}</option>`).join('') +
          (dist ? '<option value="__manual__">✎ অন্যান্য / নিজে লিখব</option>' : '');
        if (dist && !options.length) up.value = '__manual__';
        else if (preserveManual && old === '__manual__') up.value = old;
        bdUpazilaChanged();
        const hint = document.querySelector('#bd-geo-status'); if (hint) hint.textContent = dist ? (options.length ? `এই জেলার ${options.length}টি উপজেলা/থানা পাওয়া গেছে। আপনার এলাকা তালিকায় না থাকলে ‘অন্যান্য’ বেছে নিন।` : 'আপনার উপজেলা / শহরের থানা নিচের ঘরে লিখুন।') : 'যথাযথ জেলা নির্বাচন করুন।';
      }
      function bdUpazilaChanged() {
        const up = document.querySelector('#checkout-upazila'); const union = document.querySelector('#checkout-union'); if (!up || !union) return;
        const custom = document.querySelector('#upazila-custom-field');
        if (custom) custom.hidden = up.value !== '__manual__';
        const customInput = document.querySelector('#checkout-upazila-custom'); if (customInput) customInput.required = up.value === '__manual__';
        const selected = bdGetUpazilas(document.querySelector('#checkout-division')?.value, document.querySelector('#checkout-district')?.value).find(x => x.name === up.value);
        const areas = [...(selected?.unions || []).map(x => ({...x, type: 'ইউনিয়ন'})), ...(selected?.pourashavas || []).map(x => ({...x, type: 'পৌরসভা'}))];
        union.disabled = !up.value;
        union.innerHTML = '<option value="">ইউনিয়ন / পৌরসভা / ওয়ার্ড (ঐচ্ছিক)</option>' + areas.map(x => `<option value="${e(x.name)}">${e(x.bn_name)} · ${e(x.name)} (${x.type})</option>`).join('') +
          (up.value ? '<option value="__manual__">✎ অন্যান্য / শহরের এলাকা</option>' : '');

      function bdUnionChanged() {
        const union = document.querySelector('#checkout-union'); const custom = document.querySelector('#union-custom-field');

      function bdCheckAndClean(form, data) {
        const division = bdBase.find(x => x.en === data.division);
        if (!division || !division.districts.find(x => x.en === data.district)) throw Error('সঠিক বিভাগ ও জেলা নির্বাচন করুন।');
        data.upazila = String(data.upazilaSelect === '__manual__' ? data.upazilaCustom : data.upazilaSelect || '').trim();
        if (!data.upazila) throw Error('উপজেলা বা থানার নাম লিখুন / নির্বাচন করুন।');
        data.union = String(data.unionSelect === '__manual__' ? data.unionCustom : data.unionSelect || '').trim();
        if (!String(data.locality || '').trim()) throw Error('এলাকা / গ্রাম / মহল্লা লিখুন।');
        data.address = [data.address, data.locality, data.union, data.upazila, data.district, data.division].filter(Boolean).join(', ');
        delete data.upazilaSelect; delete data.upazilaCustom; delete data.unionSelect; delete data.unionCustom;
        if (data.latitude && !/^\-?\d+(\.\d+)?$/.test(data.latitude)) delete data.latitude;
        if (data.longitude && !/^\-?\d+(\.\d+)?$/.test(data.longitude)) delete data.longitude;
        return data;
      }
      function bdGetCurrentPosition() {
        const button = document.querySelector('#use-location'), status = document.querySelector('#geo-position-status');
        if (!status) return;
        if (!navigator.geolocation) {status.textContent = 'এই ব্রাউজারে GPS Location সাপোর্ট নেই। ম্যাপ লিংক বা ঠিকানা লিখুন।'; return;}

        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude.toFixed(6), lon = pos.coords.longitude.toFixed(6);
          const la = document.querySelector('#checkout-latitude'), lo = document.querySelector('#checkout-longitude');
          if (la) la.value = lat; if (lo) lo.value = lon;
          status.textContent = '✓ GPS লোকেশন যুক্ত হয়েছে (' + lat + ', ' + lon + ').';
          if (button) button.disabled = false;
        }, error => {status.textContent = error.code === 1 ? 'GPS Location অনুমতি দেওয়া হয়নি। নিজের ঠিকানা বা ম্যাপ লিংক লিখুন।' : 'লোকেশন পাওয়া যায়নি। ঠিকানা/ম্যাপ লিংক দিয়ে চেষ্টা করুন।'; if (button) button.disabled = false;}, {enableHighAccuracy: false, timeout: 9000, maximumAge: 60000});
      }

      function preorderSubtotal() {return store.cart.reduce((n, line) => {const p = store.products.find(x => x.id === line.productId); return n + (line.mode === 'preorder' && p ? p.price * line.qty : 0)}, 0)}

      function checkout() {
        if (store.placed) return `<div class="success-box"><div class="success-symbol">✓</div><span class="eyebrow">DEMO ORDER SAVED</span><h2>You're all set!</h2><p>Thank you for shopping with PASSUS. This request is saved only in this browser; the shop has not received it.</p><span class="success-id">${e(store.placed.id)}</span><p>Save your order ID and phone number for tracking.</p><button class="btn btn-primary" data-tab="track">TRACK MY ORDER ${icon('arrow')}</button><a href="/shop" class="btn btn-outline" style="margin-left:9px">CONTINUE SHOPPING</a></div>`;

<div class="field"><label for="checkout-locality">এলাকা / গ্রাম / মহল্লা / Local Area *</label><input id="checkout-locality" name="locality" required minlength="2" maxlength="160" placeholder="যেমন: Halishahar, Block B / Uttara Sector 7"></div>
<div class="field"><label for="checkout-address">সম্পূর্ণ ঠিকানা / House, Road, Landmark *</label><textarea id="checkout-address" name="address" required minlength="8" maxlength="400" placeholder="বাসা/হোল্ডিং নম্বর, রোড, ব্লক, কাছের পরিচিত স্থান..." autocomplete="street-address"></textarea></div>

      function route() {
        const path = (location.hash || '#/').slice(1);
        const [beforeFragment, innerAnchor] = path.split('#');
        let url; try {url = new URL(beforeFragment, 'https://passus.demo.local')} catch {url = new URL('https://passus.demo.local/')}
        const seg = url.pathname.replace(/\/$/, '');
        page = seg === '/shop' ? 'shop' : seg === '/order' ? 'order' : 'home';
        if (page === 'shop') {
          store.gender = ['all', 'men', 'women'].includes(url.searchParams.get('gender')) ? url.searchParams.get('gender') : 'all';
          store.category = ['crocs', 'slippers', 'sneakers'].includes(url.searchParams.get('category')) ? url.searchParams.get('category') : 'all';
          store.search = url.searchParams.get('search') || '';
        }
        if (page === 'order') store.tab = ['checkout', 'track', 'message'].includes(url.searchParams.get('tab')) ? url.searchParams.get('tab') : 'checkout';
        store.menu = false;
        closeSearch(); closeLayer('modal-layer'); closeLayer('drawer-layer');
        render();
        if (innerAnchor) requestAnimationFrame(() => document.getElementById(innerAnchor)?.scrollIntoView());
        else window.scrollTo({top: 0, behavior: 'instant'});
      }
      document.addEventListener('click', ev => {
        const link = ev.target.closest('a[href]'); if (!link) return;
        const target = link.getAttribute('href');
        if (!target || !target.startsWith('/')) return;
        ev.preventDefault();
        const next = '#' + target;
        if (location.hash === next) route(); else location.hash = next;
      });
      window.addEventListener('hashchange', route);
      function init() {store.products = embeddedProducts; store.cart = store.cart.filter(line => store.products.some(p => p.id === line.productId && p.sizes.includes(Number(line.size)))); persistCart(); route(); bdFetchGeo()}
      init();
    })();

<script id="passus-four-shoe-hero">
(() => {
  const slides = [
    {src:'assets/men_black.webp', alt:'PASSUS black sport slip-on for men'},
    {src:'assets/men_samba.webp', alt:'PASSUS Samba sneaker for men'},
    {src:'assets/women_black_crochet.webp', alt:'PASSUS black crochet sandal for women'},
    {src:'assets/women_cream_crochet.webp', alt:'PASSUS cream crochet sandal for women'}
  ];
  function initPassusHeroSlider() {
    const img = document.querySelector('.main-shoe');
    if (!img || img.dataset.passusSliderReady) return;
    img.dataset.passusSliderReady = '1';
    let index = 0;
    img.src = slides[index].src;
    img.alt = slides[index].alt;
    img.style.objectFit = 'contain';
    img.style.transformOrigin = '50% 55%';
    img.style.willChange = 'transform, opacity, filter';
    img.style.transition = 'opacity 1.05s ease-in-out, transform 1.35s cubic-bezier(.22,.72,.2,1), filter 1.05s ease';
    window.setInterval(() => {
      index = (index + 1) % slides.length;
      img.style.opacity = '0';
      img.style.filter = 'blur(3px)';
      img.style.transform = 'translate3d(42px, 8px, 0) rotate(13deg) scale(.94)';
      window.setTimeout(() => {
        img.src = slides[index].src;
        img.alt = slides[index].alt;
        img.style.transform = 'translate3d(-34px, -4px, 0) rotate(-9deg) scale(.96)';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            img.style.opacity = '1';
            img.style.filter = 'blur(0)';
            img.style.transform = 'translate3d(0, 0, 0) rotate(0deg) scale(1)';
          });
        });
      }, 720);
    }, 5500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPassusHeroSlider);
  else initPassusHeroSlider();
  const observer = new MutationObserver(() => {
    const img = document.querySelector('.main-shoe');
    if (img && !img.dataset.passusSliderReady) initPassusHeroSlider();
  });
  observer.observe(document.documentElement, {childList:true,subtree:true});
})();
</script>


<script id="passus-mobile-cart-count-sync">
(() => {
  const sync = () => {
    const source = document.getElementById('cart-count');
    const target = document.getElementById('mobile-cart-count');
    if (source && target) target.textContent = source.textContent || '0';
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync);
  else sync();
  const observer = new MutationObserver(sync);
  const source = document.getElementById('cart-count');
  if (source) observer.observe(source, {childList:true,subtree:true,characterData:true});
  document.addEventListener('click', () => setTimeout(sync, 0));
})();
</script>
